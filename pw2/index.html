<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petworld — Pet Store &amp; Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <a class="logo" href="#">
      <img src="assets/logo.svg" alt="" width="35" height="35">
      Petworld
    </a>
    <nav class="nav">
      <a href="#">Sign Up</a>
      <a class="btn btn--blue" href="#">Log in</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero__title">Pet Store &amp; Beyond</h1>
      <p class="hero__text">
        Fresh ingredients slowly baked into our super delicious food.
        Available in a range of delicious flavours, delivered to your door.
      </p>
      <a class="btn btn--yellow" href="#">Get Started</a>
    </section>

    <section class="video">
      <div class="video__player">
        <button class="video__play" type="button">
          <img src="assets/play.svg" alt="Play video" width="46" height="51">
        </button>
      </div>
    </section>
  </main>

</body>
</html>
