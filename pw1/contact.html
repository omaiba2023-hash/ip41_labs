<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти — Global Adventures Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Зв'яжіться з нами ✉️</h1>
        <p>Маєте запитання чи пропозиції? Напишіть нам повідомлення!</p>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="kyiv.html">Київ</a></li>
            <li><a href="tokyo.html">Токіо</a></li>

            <li><a href="contact.html">Контакти</a></li>
            <li><a href="subscribe.html">Підписка</a></li>
        </ul>
    </nav>
    <main>
        <form action="#" method="post">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" placeholder="Олег" required>

            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="subject">Тема повідомлення:</label>
            <input type="text" id="subject" name="subject" placeholder="Тема..." required>

            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="5" placeholder="Ваше повідомлення..." required></textarea>

            <button type="submit">Надіслати</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2035 Global Adventures Blog. Всі права захищено.</p>
    </footer>
</body>
</html>
